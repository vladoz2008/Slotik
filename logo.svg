<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient3d" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="shadow3d">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Тень -->
  <ellipse cx="50" cy="92" rx="35" ry="4" fill="#7C3AED" opacity="0.2" />

  <!-- Круг с 3D эффектом -->
  <circle cx="50" cy="48" r="42" fill="#6B21A8" />
  <circle cx="50" cy="46" r="42" fill="url(#gradient3d)" filter="url(#shadow3d)" />

  <!-- Блик -->
  <ellipse cx="38" cy="35" rx="15" ry="12" fill="white" opacity="0.3" />

  <!-- Слот с глубиной -->
  <rect x="30" y="28" width="40" height="40" rx="8" fill="#E0E0E0" />
  <rect x="29" y="27" width="40" height="40" rx="8" fill="white" />

  <!-- Галочка с тенью -->
  <path d="M 37 48 L 45 56 L 61 38" stroke="#9333EA" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3" />
  <path d="M 37 46 L 45 54 L 61 36" stroke="#7C3AED" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
